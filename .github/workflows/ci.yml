name: Python checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Resolve and install
        run: uv sync
      - name: Compile
        run: uv run python -m compileall -q src tests examples
      - name: Lint
        run: uvx ruff check src tests examples --select E4,E7,E9,F
      - name: Types
        run: uvx basedpyright src/mt5_datahub
      - name: Offline unit tests with coverage
        run: |
          uv run --with coverage coverage run --source=mt5_datahub -m unittest discover -s tests -v
          uv run --with coverage coverage report -m --fail-under=65
      - name: Build distributable
        run: uv build
