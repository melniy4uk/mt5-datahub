name: Python checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - name: Resolve and install
        run: uv sync
      - name: Compile
        run: uv run python -m compileall -q src tests examples
      - name: Unit tests
        run: uv run python -m unittest discover -s tests -v
