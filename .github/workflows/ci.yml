name: Python checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check reproducible lockfile
        run: uv lock --check
      - name: Resolve and install
        run: uv sync --locked
      - name: Compile
        run: uv run python -m compileall -q src tests examples
      - name: Lint
        run: uvx ruff check src tests examples --select E4,E7,E9,F
      - name: Types
        run: uvx basedpyright src/mt5_datahub
      - name: Offline unit tests with coverage
        run: |
          uv run --with coverage coverage run --source=mt5_datahub -m unittest discover -s tests -v
          uv run --with coverage coverage report -m --fail-under=65
      - name: Build distributable
        run: uv build
      - name: Verify isolated wheel install
        shell: pwsh
        run: |
          $wheel = Get-ChildItem -Path dist -Filter '*.whl' | Select-Object -First 1
          if ($null -eq $wheel) { throw 'Missing wheel in dist' }
          uv venv .release-test-env --python ${{ matrix.python-version }}
          $python = Join-Path (Get-Location) '.release-test-env/Scripts/python.exe'
          uv pip install --python $python $wheel.FullName
          & $python -c "from importlib.metadata import version; from mt5_datahub import MarketData, CacheInspection, inspect_cache; assert version('mt5-datahub') == '0.2.0'; print('Wheel API import PASS')"
