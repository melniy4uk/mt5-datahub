[project]
name = "mt5-datahub"
version = "0.2.0.dev0"
description = "Historical MetaTrader 5 market data with Parquet caching"
readme = "README.md"
authors = [{ name = "Melnik" }]
requires-python = ">=3.13"
dependencies = [
    "metatrader5>=5.0.6231",
    "numpy>=2.5.4",
    "pyarrow>=18.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
